<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>הצמחים של גדי — טיימליין פריחה שנתי</title>
<meta name="description" content="טיימליין שנתי של פוסטי הטבע והפריחה השבועיים של גדי אלסר מאלון הגליל, מאוגדים לפי חודשי השנה.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <h1>הצמחים של גדי</h1>
  <p class="subtitle">פוסטי הטבע והפריחה של גדי אלסר · אלון הגליל · לפי חודשי השנה</p>
</header>

<!-- Floating view tabs: Timeline / Plant index -->
<nav class="tabs" aria-label="תצוגה">
  <button id="tab-timeline" class="tab is-active" type="button">טיימליין</button>
  <button id="tab-index" class="tab" type="button">אינדקס</button>
</nav>

<main id="app" aria-live="polite">
  <p class="loading">טוען…</p>
</main>

<!-- Floating back button (month / plant views) -->
<button id="back-btn" class="back-btn" type="button" hidden>→ חזרה לתצוגת השנה</button>

<footer class="site-footer">
  <p>הפוסטים והתמונות: גדי אלסר, קבוצת אלון הגליל בפייסבוק · כל כרטיס מקשר לפוסט המקורי</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
